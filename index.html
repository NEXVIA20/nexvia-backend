<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXVIA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: white;
            padding: 60px 25px 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 70px;
        }

        .question {
            font-size: 24px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 55px;
        }

        .buttons {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        button {
            border: none;
            background: #f1f3f5;
            border-radius: 18px;
            padding: 25px 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e7eaee;
        }

        .icon {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .tagline {
            margin-top: auto;
            padding-top: 60px;
            font-size: 15px;
            color: #666;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="logo">
            NEXVIA
        </div>

        <div class="question">
            What's troubling you?
        </div>

        <div class="buttons">

            <button onclick="talk()">
                <span class="icon">🎤</span>
                TALK
            </button>

            <button onclick="showPhoto()">
                <span class="icon">📷</span>
                SHOW
            </button>

            <button onclick="typeProblem()">
                <span class="icon">⌨️</span>
                TYPE
            </button>

            <button onclick="sendLink()">
                <span class="icon">🔗</span>
                SEND
            </button>

        </div>

        <div class="tagline">
            Keep your mind uncluttered.
        </div>

    </div>

    <script>

        function talk() {
            alert("TALK will be connected next.");
        }

        function showPhoto() {
            alert("SHOW will be connected next.");
        }

        function typeProblem() {
            alert("TYPE will be connected next.");
        }

        function sendLink() {
            alert("SEND will be connected next.");
        }

    </script>

</body>
</html>
