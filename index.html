<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXVIA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding: 55px 24px 30px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 65px;
        }

        .question {
            text-align: center;
            font-size: 24px;
            margin-bottom: 45px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            border: none;
            border-radius: 18px;
            background: #f1f3f5;
            padding: 25px 10px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e5e7eb;
        }

        .icon {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .tagline {
            margin-top: auto;
            padding-top: 50px;
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .back {
            background: transparent;
            padding: 8px;
            font-size: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 15px;
            font-size: 17px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #999;
        }

        .send-button {
            width: 100%;
            margin-top: 15px;
            background: #222;
            color: white;
            padding: 16px;
        }

        .send-button:hover {
            background: #000;
        }

        .loading {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 16px;
            line-height: 1.6;
        }

        .intent {
            font-size: 13px;
            color: #777;
            margin-bottom: 10px;
        }

        .answer {
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HOME SCREEN -->

    <div id="homeScreen" class="screen active">

        <div class="logo">
            NEXVIA
        </div>

        <div class="question">
            What's troubling you?
        </div>

        <div class="buttons">

            <button onclick="showComingSoon('TALK')">
                <span class="icon">🎤</span>
                TALK
            </button>

            <button onclick="showComingSoon('SHOW')">
                <span class="icon">📷</span>
                SHOW
            </button>

            <button onclick="openType()">
                <span class="icon">⌨️</span>
                TYPE
            </button>

            <button onclick="showComingSoon('SEND')">
                <span class="icon">🔗</span>
                SEND
            </button>

        </div>

        <div class="tagline">
            Keep your mind uncluttered.
        </div>

    </div>


    <!-- TYPE SCREEN -->

    <div id="typeScreen" class="screen">

        <button class="back" onclick="goHome()">
            ← Back
        </button>

        <div class="logo">
            NEXVIA
        </div>

        <div class="question">
            Tell me what is troubling you.
        </div>

        <textarea
            id="problemInput"
            placeholder="Type your problem here..."
        ></textarea>

        <button class="send-button" onclick="sendProblem()">
            SEND
        </button>

        <div id="loading" class="loading"></div>

        <div id="result" class="result" style="display:none;">

            <div id="intent" class="intent"></div>

            <div id="answer" class="answer"></div>

        </div>

    </div>

</div>


<script>

    function openType() {

        document.getElementById("homeScreen").classList.remove("active");

        document.getElementById("typeScreen").classList.add("active");

        document.getElementById("problemInput").focus();
    }


    function goHome() {

        document.getElementById("typeScreen").classList.remove("active");

        document.getElementById("homeScreen").classList.add("active");

        document.getElementById("problemInput").value = "";

        document.getElementById("result").style.display = "none";

        document.getElementById("loading").innerText = "";
    }


    async function sendProblem() {

        const input = document.getElementById("problemInput");

        const message = input.value.trim();

        if (!message) {

            alert("Please type your problem first.");

            return;
        }

        document.getElementById("loading").innerText =
            "NEXVIA is thinking...";

        document.getElementById("result").style.display = "none";

        try {

            const response = await fetch(
                "/chat/text?message=" +
                encodeURIComponent(message)
            );

            if (!response.ok) {

                throw new Error("Server error");

            }

            const data = await response.json();

            document.getElementById("loading").innerText = "";

            document.getElementById("intent").innerText =
                "NEXVIA understood this as: " + data.intent;

            document.getElementById("answer").innerText =
                data.nexvia_response;

            document.getElementById("result").style.display = "block";

        }

        catch (error) {

            document.getElementById("loading").innerText = "";

            document.getElementById("answer").innerText =
                "Sorry, NEXVIA could not connect to the server. Please try again.";

            document.getElementById("result").style.display = "block";

        }
    }


    function showComingSoon(feature) {

        alert(
            feature +
            " will be connected in the next stage."
        );

    }

</script>

</body>
</html>
